site_name: SurvFM
site_description: Documentation for SurvFM survival prediction with tabular models
site_url: "https://yuelyu21.github.io/SurvFM/"
repo_url: "https://github.com/yuelyu21/SurvFM"
repo_name: "yuelyu21/SurvFM"
edit_uri: "edit/main/website/"
docs_dir: website
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  font:
    text: Inter
    code: IBM Plex Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.highlight

nav:
  - Overview: index.md
  - Install: installation.md
  - Quickstart: quickstart.md
  - Concepts:
      - Method overview: concepts/method-overview.md
      - Pseudo-RMST targets: concepts/pseudo-rmst.md
      - Choosing the horizon: concepts/horizon.md
      - Shared regression interface: concepts/backbone-interface.md
  - Guides:
      - Backbone setup: guides/backbones.md
      - Mixed data: guides/mixed-data.md
      - Save and load: guides/persistence.md
      - Experimental curves and IBS: guides/survival-curves.md
  - API:
      - Estimator: api/estimator.md
      - Targets and horizons: api/targets.md
      - Metrics: api/metrics.md
  - Reproducibility: reproducibility.md
  - Limitations: limitations.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

copyright: Copyright &copy; 2026 Yue Lyu and contributors. Released under the MIT License.
