name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[sklearn,dev]"
      - name: Test
        run: python -m pytest
      - name: Build distribution
        run: python -m build

  experimental-curves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install curve example dependencies
        run: python -m pip install -e ".[curves,dev]"
      - name: Test curve adapters and IBS evaluation
        run: python -m pytest tests/test_experimental_cox_mapping.py tests/test_experimental_multihorizon.py tests/test_experimental_curve_metrics.py
      - name: Run synthetic examples without foundation weights
        run: |
          python examples/experimental_survival_curves.py --method oof-cox --output runs/cox-demo
          python examples/experimental_survival_curves.py --method multihorizon --output runs/multihorizon-demo
